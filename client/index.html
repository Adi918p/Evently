<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable: pinch zoom must stay available
         (viewport-meta). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Evently — Events, clubs and nights out near you</title>
    <meta
      name="description"
      content="Find events, club nights, concerts and parties near you. Book tickets in seconds and walk straight in with a QR pass."
    />
    <meta name="theme-color" content="#050510" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/Media/Png/logo.jpg" />
    <link rel="apple-touch-icon" href="/Media/Png/logo.jpg" />

    <!-- Fonts are requested here rather than with @import in global.css. Two
         reasons: an @import is a chained request that cannot start until the
         stylesheet has been fetched and parsed, and because global.css pulls in
         Tailwind first, the font @import ended up after other rules where
         PostCSS drops it outright. display=swap keeps text visible while the
         faces download (font-loading). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..900&family=Rubik:wght@300..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Evently" />
    <meta property="og:title" content="Evently — your city, your next story" />
    <meta
      property="og:description"
      content="Discover. Book. Experience. Events, clubs and concerts near you."
    />
    <meta property="og:image" content="/Media/Png/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          max-width: 40rem;
          margin: 6rem auto;
          padding: 2rem;
          font-family: system-ui, sans-serif;
          color: #f8fafc;
          text-align: center;
        "
      >
        <h1>Evently needs JavaScript</h1>
        <p>
          Turn JavaScript on to browse events and book tickets. If you can't,
          email us and we'll book you in manually.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
